name: Check versions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: plugin.json, SKILL.md y CHANGELOG con la misma versión
        run: scripts/check-versions.sh
